global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'inventarprogramm'
    metrics_path: '/api/v1/metrics'
    basic_auth:
      username: 'admin'
      password: '${INVENTAR_ADMIN_PASSWORD:-admin1234}'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']