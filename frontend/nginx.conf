server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: Service Worker und Manifest ohne Cache ausliefern
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS-Server. Wird fuer den Kamera-Zugriff (Barcode-/QR-Scan) auf
# Mobilgeraeten benoetigt, da Browser "getUserMedia" (Kamerazugriff per
# JavaScript) nur in einem sogenannten "secure context" erlauben - also
# entweder ueber HTTPS oder auf "localhost". Das Zertifikat wird beim
# Installieren/Starten automatisch als selbstsigniertes Zertifikat erzeugt
# (siehe installer/*). Der Browser zeigt beim ersten Aufruf deshalb eine
# Warnung ("nicht vertrauenswuerdiges Zertifikat") - das ist normal und
# muss einmalig pro Geraet bestaetigt werden ("Trotzdem fortfahren").
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
