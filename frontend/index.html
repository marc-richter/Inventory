<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#a50014" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Favicon = hinterlegtes Logo (fällt auf Standard-Icon zurück, wenn keines gesetzt ist) -->
    <link rel="icon" href="/api/settings/logo" />
    <link rel="apple-touch-icon" href="/api/settings/logo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Inventarprogramm</title>
    <script>
      // Theme vor dem Rendern setzen, um ein Aufblitzen des falschen Modus zu vermeiden.
      (function () {
        try {
          var t = localStorage.getItem('inventar_theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
