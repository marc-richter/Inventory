name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Von Hand ausloesbar - z.B. um vor einem Update am Abend noch einmal alles
  # durchlaufen zu lassen, ohne etwas zu aendern.
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools
        run: pip install -r requirements-dev.txt

      # Regelauswahl steht in backend/pyproject.toml: nur echte Fehler,
      # keine Stilfragen.
      - name: Run ruff
        run: ruff check app tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: inventar-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: inventar-frontend:test
          load: true

      - name: Check compose file
        run: docker compose config --quiet

      # Die Testsuite noch einmal IM Container - dieselbe Python-Fassung und
      # dieselben Pakete wie spaeter im Betrieb. Der Lauf weiter oben nutzt das
      # Python der Werkbank; Unterschiede zwischen beiden sind genau die Art
      # Fehler, die sonst erst auf dem Server auftaucht.
      - name: Tests im Container
        run: docker compose -f docker-compose.test.yml run --rm tests

  docker-arm64:
    # Der Raspberry Pi laeuft auf arm64, die Werkbank hier auf amd64. Fehlt fuer
    # ein Paket ein fertiges arm64-Paket, muesste es auf dem Pi uebersetzt
    # werden - das dauert entweder ewig oder bricht ab. Ohne diesen Auftrag
    # faellt das erst beim Update auf, und dann steht der Verein ohne Programm da.
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: QEMU einrichten (arm64 auf amd64 ausfuehren)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Backend-Abbild fuer arm64 bauen
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend-Abbild fuer arm64 bauen
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health; then
              echo "Backend erreichbar"
              exit 0
            fi
            sleep 2
          done
          echo "Backend nicht gestartet"
          docker compose logs
          exit 1

      - name: Run integration tests
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin1234"}' | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/v1/auth/me

      - name: Cleanup
        if: always()
        run: docker compose down -v
