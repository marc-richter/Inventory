services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-bitte-in-env-datei-aendern}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin1234}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      # Optionale Personalisierung aus der Erstinstallation (leer = spaeter in der App)
      - DEFAULT_ORG_NAME=${DEFAULT_ORG_NAME:-}
      - DEFAULT_LOGO_FILE=${DEFAULT_LOGO_FILE:-}
    volumes:
      - inventar_data:/app/data
      - ${BACKUP_HOST_PATH:-./backups}:/app/data/backups
      - ./VERSION:/app/VERSION:ro
      # Von der Verwaltungs-App bei der Erstinstallation bereitgestellte Assets
      # (z.B. ein optional gewaehltes Logo), schreibgeschuetzt eingebunden.
      - ${INITIAL_ASSETS_HOST_PATH:-./config}:/app/initial:ro
      # Steuer-Verzeichnis fuer Signaldateien (z.B. Server herunterfahren). Ein
      # host-seitiger Watcher (siehe installer/) wertet diese aus.
      - ${CONTROL_HOST_PATH:-./control}:/app/control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      - ${CERTS_HOST_PATH:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  inventar_data:
